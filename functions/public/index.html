<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Chauverie</title>
<meta name="description" content="Collectionne les chauves, ouvre des packs au Salon, vends et enchéris en direct au Marché.">
<link rel="icon" href="/img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Albert+Sans:ital,wght@0,400;0,600;0,800;1,400&family=Martian+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/carte.css">
<style>
  /* Univers unique : l'enseigne néon du logo, sur la nuit. Pas de thème clair, par choix. */
  :root{
    color-scheme:dark;
    --nuit:#0c0812; --pan:#15101d; --pan2:#1d1628; --trait:#2d2240; --trait2:#3d2f55;
    --txt:#f4eef8; --mut:#a697b8; --mut2:#76688a;
    --orange:#ff7b1c; --orange-c:#ffb070; --rose:#ff4f8b; --violet:#b64dff; --violet-c:#d9a2ff;
    --neon:linear-gradient(90deg,#ff7b1c,#ff4f8b 50%,#b64dff);
    --ok:#4fe39a; --ko:#ff5a6e;
    --r-commun:#c9bfd8; --r-rare:#3fc1ff; --r-epique:#b64dff; --r-legendaire:#ff7b1c;
    --display:"Tilt Neon","Trebuchet MS",system-ui,sans-serif;
    --body:"Albert Sans","Segoe UI",system-ui,sans-serif;
    --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--nuit);color:var(--txt);font:16px/1.5 var(--body);
    background-image:radial-gradient(60% 50% at 12% 0%,rgba(255,123,28,.10),transparent 70%),radial-gradient(50% 45% at 100% 10%,rgba(182,77,255,.12),transparent 70%);
    background-attachment:fixed}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--violet-c);outline-offset:3px}
  img{max-width:100%}
  [hidden]{display:none!important}
  a.btn{text-decoration:none}

  /* ---------- structure ---------- */
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;border-right:1px solid var(--trait);background:rgba(12,8,18,.85)}
  .marque{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none;color:inherit}
  .marque img{width:46px;height:45px;border-radius:10px}
  .marque b{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.05;background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,79,139,.45))}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:600}
  .nav a svg{width:21px;height:21px;flex:none}
  .nav a:hover{color:var(--txt);background:var(--pan)}
  .nav a[aria-current="page"]{color:var(--txt);background:var(--pan2);box-shadow:inset 2px 0 0 var(--orange),0 0 0 1px var(--trait)}
  .nav a[aria-current="page"] svg{color:var(--orange-c);filter:drop-shadow(0 0 4px var(--orange))}
  .nav a.atelier{margin-top:10px;border:1px dashed var(--trait2)}
  .main{min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 28px;background:linear-gradient(var(--nuit) 60%,transparent)}
  .solde{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--pan);border:1px solid var(--trait2);font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .solde svg{width:22px;height:22px}
  .qui{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:600;font-size:14px}
  .qui i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pan2);border:1px solid var(--trait2)}
  .qui i svg{width:18px;height:18px}
  .view{padding-block:6px 60px;padding-inline:28px;max-width:1200px;width:100%}

  /* ---------- typo ---------- */
  h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,50px);line-height:1.05;margin:0 0 6px;text-wrap:balance;color:#fff;
    text-shadow:0 0 6px rgba(255,123,28,.75),0 0 22px rgba(255,79,139,.45)}
  h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0 0 14px;color:#fff;text-shadow:0 0 10px rgba(182,77,255,.55);text-wrap:balance}
  h3{font-size:17px;margin:0;font-weight:800}
  .sub{color:var(--mut);margin:0 0 26px;max-width:62ch}
  .mut{color:var(--mut)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .etiq{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}

  /* ---------- briques ---------- */
  .pan{background:var(--pan);border:1px solid var(--trait);border-radius:16px;padding:20px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grille2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
  .pile{display:grid;gap:20px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;background:var(--pan2);border:1px solid var(--trait2);transition:transform .08s,box-shadow .15s}
  .btn:hover{box-shadow:0 0 0 1px var(--violet),0 0 14px rgba(182,77,255,.35)}
  .btn:active{transform:translateY(1px)}
  .btn.neon{background:var(--neon);border:0;color:#1a0b12;box-shadow:0 0 18px rgba(255,79,139,.45)}
  .btn.neon:hover{box-shadow:0 0 26px rgba(255,79,139,.7)}
  .btn.petit{padding:6px 12px;font-size:14px;border-radius:10px}
  .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn svg{width:18px;height:18px}
  .champ{display:grid;gap:6px;font-weight:600;font-size:14px}
  .champ input,.champ select,.champ textarea{width:100%;padding:10px 12px;border-radius:10px;background:var(--nuit);border:1px solid var(--trait2)}
  .champ textarea{min-height:80px;resize:vertical}
  .champ small{color:var(--mut2);font-weight:400}
  .onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .onglet{padding:7px 14px;border-radius:999px;font-weight:700;color:var(--mut);border:1px solid var(--trait2)}
  .onglet[aria-pressed="true"]{color:#1a0b12;background:var(--neon);border-color:transparent}
  .puce{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid currentColor}
  .jauge{height:8px;border-radius:99px;background:var(--pan2);overflow:hidden}
  .jauge>i{display:block;height:100%;background:var(--neon);box-shadow:0 0 10px rgba(255,79,139,.6)}
  .vide{padding:26px;border:1px dashed var(--trait2);border-radius:14px;color:var(--mut);text-align:center}
  .reflet{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .reflet svg{width:1.15em;height:1.15em}

  /* ---------- carte de chauve ---------- */
  .cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 20px}
  .carte{display:block;width:100%;padding:0;transition:transform .15s}
  .carte:hover{transform:translateY(-4px)}
  .r-rare{--rc:var(--r-rare)} .r-epique{--rc:var(--r-epique)} .r-legendaire{--rc:var(--r-legendaire)} .r-unique{--rc:#ff4f8b} .r-or{--rc:#ffcf3f}
  .badge-chrome{color:#bff0ff;border-color:#7fdcff}

  /* ---------- accueil ---------- */
  .hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px;border-radius:20px;border:1px solid var(--trait);overflow:hidden;
    background:radial-gradient(70% 120% at 0% 0%,rgba(255,123,28,.18),transparent 60%),radial-gradient(60% 120% at 100% 100%,rgba(182,77,255,.22),transparent 60%),var(--pan)}
  .hero p{margin:0 0 18px;color:var(--mut);max-width:52ch}
  .hero .trio{display:flex}
  .hero .trio img+img{margin-left:-14px}
  .hero .trio img{width:92px;aspect-ratio:600/1066;object-fit:cover;border-radius:12px;border:1px solid var(--trait2);box-shadow:0 8px 20px rgba(0,0,0,.5)}
  .hero .trio img:nth-child(2){transform:translateY(-12px) scale(1.06);box-shadow:0 0 22px rgba(255,79,139,.45)}
  .fil{display:grid;gap:10px;margin:0;padding:0;list-style:none}
  .fil li{display:flex;gap:10px;align-items:center;font-size:14.5px}
  .fil li .t{margin-left:auto;color:var(--mut2);font-size:12.5px;white-space:nowrap}
  .fil .pt{width:8px;height:8px;border-radius:50%;flex:none;background:var(--rc,var(--mut2));box-shadow:0 0 8px var(--rc,transparent)}
  .grade{display:flex;gap:16px;align-items:center}
  .grade svg{width:78px;height:78px;flex:none}
  .grade b{font-family:var(--display);font-weight:400;font-size:24px;display:block;line-height:1.1}

  /* ---------- salon ---------- */
  .rayon{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,340px));gap:26px;justify-content:center}
  .booster{display:grid;gap:8px;justify-items:center;text-align:center;padding:14px 18px 22px;border-radius:20px;border:1px solid var(--trait);
    background:radial-gradient(80% 60% at 50% 35%,rgba(255,79,139,.14),transparent 70%),var(--pan)}
  .booster h2{margin:6px 0 0}
  .booster .prix{font-size:22px}
  /* le fond noir de l'image s'efface (mode « éclaircir ») */
  .bo-img{display:block;width:min(100%,250px);transition:transform .25s}
  .bo-img img{display:block;width:100%;aspect-ratio:2/3;object-fit:contain;mix-blend-mode:lighten;animation:flotte 4s ease-in-out infinite}
  .bo-img:hover{transform:scale(1.05) rotate(-2deg)}
  @keyframes flotte{50%{transform:translateY(-8px)}}
  .taux{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .taux div{padding:10px 12px;border-radius:12px;background:var(--pan);border:1px solid var(--trait)}
  .taux b{display:block;font-family:var(--mono);font-size:15px}
  .salon{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;gap:18px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:rgba(6,3,10,.94)}
  .salon>h2{margin-top:auto} .salon>.row{margin-bottom:auto}
  .salon.ouvert{display:flex}
  .salon .etal{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:1000px}
  .scene-b{position:relative;width:min(62vw,300px);aspect-ratio:2/3}
  .scene-b .halo{position:absolute;inset:-30%;background:radial-gradient(closest-side,rgba(255,79,139,.45),rgba(182,77,255,.25) 45%,transparent 70%);opacity:.5;animation:pouls 1.6s ease-in-out infinite}
  .sachet{position:absolute;inset:0;animation:arrive .7s cubic-bezier(.2,1.3,.4,1) both}
  .sachet span{position:absolute;inset:0;background:center/contain no-repeat;mix-blend-mode:lighten;transition:transform .7s cubic-bezier(.3,.1,.3,1),opacity .5s}
  .sachet .eclair{inset:0 9%;background:linear-gradient(180deg,transparent 9%,#fff 12.5%,#ffb070 14%,transparent 19%);mix-blend-mode:screen;opacity:0;transition:opacity .15s}
  @keyframes arrive{from{transform:translateY(60px) scale(.4) rotate(-12deg);opacity:0}}
  .tremble .sachet{animation:tremble .11s linear infinite}
  .tremble .halo{opacity:1;animation-duration:.4s}
  @keyframes tremble{0%{transform:translate(-3px,1px) rotate(-1.4deg)}50%{transform:translate(3px,-2px) rotate(1.4deg)}100%{transform:translate(-2px,2px) rotate(-.8deg)}}
  .craque .sachet{animation:none}
  .craque .haut{transform:translate(46%,-70%) rotate(38deg);opacity:0}
  .craque .eclair{opacity:1;animation:fondu .6s .1s forwards}
  .craque .halo{opacity:1;transform:scale(1.5);transition:transform .5s}
  @keyframes fondu{to{opacity:0}}
  .vide .bas{transform:translateY(46%) scale(.92);opacity:0;transition-duration:.35s}
  .eclats{position:absolute;left:50%;top:13%}
  .eclats i{position:absolute;width:7px;height:12px;border-radius:2px;opacity:0}
  .craque .eclats i{animation:eclat var(--t) ease-out forwards}
  @keyframes eclat{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) rotate(260deg)}}
  .etal[hidden]{display:none}
  .etal .fente{opacity:0}
  .etal.sort .fente{animation:sort .5s cubic-bezier(.2,1.3,.4,1) calc(var(--i)*90ms) both}
  @keyframes sort{from{opacity:0;transform:translateY(90px) scale(.5) rotate(calc((var(--i) - 1)*8deg))}to{opacity:1;transform:none}}
  /* cartes face cachée, qui se retournent */
  .fente{--rc:var(--r-commun);position:relative;display:block;width:var(--w,200px);aspect-ratio:63/88;padding:0;perspective:1000px;transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
  .fente .pivot{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
  .fente.revele .pivot{transform:rotateY(180deg)}
  .fente .face{position:absolute;inset:0;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .fente .recto{transform:rotateY(180deg)}
  .fente .dos{border-radius:5%/3.6%;overflow:hidden;background:#000;border:2px solid #3d2f55;box-shadow:inset 0 0 0 1px #ff7b1c55,0 8px 18px rgba(0,0,0,.6)}
  .fente .dos img{display:block;width:100%;height:100%;max-width:none;object-fit:cover}
  .fente:not(.revele) .tc{animation:none}
  #fxCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
  .voile-fx{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .4s}
  .salon>h2,.salon>.etal,.salon>.row,.salon>.scene-b{position:relative;z-index:3}
  /* ----- légendaire ----- */
  .voile-fx.or{opacity:1;background:radial-gradient(circle,rgba(255,176,46,.16),rgba(0,0,0,.88) 60%)}
  .voile-fx.flash{animation:flash-or .7s ease-out}
  @keyframes flash-or{0%{background:#fff3cc}100%{}}
  .fente.vedette{z-index:5;transform:scale(1.22)}
  .fente.charge{animation:charge .09s linear infinite}
  .fente.charge .dos{border-color:#ffc85a;box-shadow:inset 0 0 0 5px #140c1d,inset 0 0 30px #ffb02e,0 0 40px #ffb02e,0 0 90px #ff7b1c}
  @keyframes charge{0%{translate:-3px 1px;rotate:-1.5deg}50%{translate:3px -2px;rotate:1.5deg}100%{translate:-1px 2px;rotate:-.6deg}}
  .fente.rayons::before{content:"";position:absolute;left:50%;top:50%;width:330%;aspect-ratio:1;translate:-50% -50%;z-index:-1;border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(from 0deg,rgba(255,200,90,.5) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:tourne-r 9s linear infinite,apparait .5s}
  .fente.r-or.rayons::before{background:conic-gradient(#fff6c9,#ffcf3f,#c98a00,#ffe58a,#fff6c9);opacity:.6;filter:blur(18px)}
  .fente.r-unique.rayons::before{background:conic-gradient(#ff4f8b,#ffb347,#fff38a,#6dffb0,#3fc1ff,#b64dff,#ff4f8b);opacity:.55;filter:blur(18px)}
  @keyframes tourne-r{to{rotate:360deg}}
  @keyframes apparait{from{opacity:0;scale:.3}}
  .annonce-r{position:fixed;left:50%;top:14%;z-index:9;translate:-50% 0;font-family:var(--display);font-size:clamp(44px,9vw,110px);line-height:1;white-space:nowrap;pointer-events:none;animation:annonce-r 2.6s forwards}
  .annonce-r.chrome{top:58%;font-size:clamp(34px,6vw,76px);background:linear-gradient(100deg,#fff,#8fe3ff 25%,#fff 45%,#ffb6dd 65%,#fff 85%,#c6b6ff) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #8fe3ff) drop-shadow(0 3px 0 #1b4a5c)}
  .annonce-r.or{background:linear-gradient(180deg,#fff,#ffe9b0 40%,#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ffb02e) drop-shadow(0 4px 0 #6b3a05)}
  @keyframes annonce-r{0%{opacity:0;scale:3}12%{opacity:1;scale:1}80%{opacity:1}100%{opacity:0;scale:1.1}}
  .salon.secousse{animation:secousse .09s linear infinite}
  .salon.secousse.fort{animation-name:secousse-f}
  @keyframes secousse{0%{translate:-6px 3px}50%{translate:6px -4px}100%{translate:-3px 5px}}
  @keyframes secousse-f{0%{translate:-16px 9px;rotate:-.6deg}50%{translate:15px -11px;rotate:.6deg}100%{translate:-9px 12px}}
  /* ----- unique ----- */
  .voile-fx.noir{opacity:1;background:#000;transition:opacity .25s}
  .voile-fx.noir::after{content:"";position:absolute;left:50%;top:50%;width:30vmin;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#ff4f8b,transparent 70%);animation:coeur .45s ease-in-out infinite}
  @keyframes coeur{0%,100%{scale:.4;opacity:.25}50%{scale:1.3;opacity:.9}}
  .voile-fx.gresille{animation:gresille .12s steps(2) infinite}
  .voile-fx.gresille::after{animation-duration:.2s;width:60vmin}
  @keyframes gresille{0%{background:#000}25%{background:#2a0018}50%{background:#000}75%{background:#12003a}100%{background:#002a33}}
  .voile-fx.blanc{opacity:1;background:#fff;transition:none}
  .voile-fx.arc{opacity:1;transition:background 1s;background:radial-gradient(circle,rgba(255,79,139,.25),rgba(8,2,16,.94) 65%)}
  .etal.eteint{opacity:0;transition:opacity .3s}
  .etal{transition:opacity .5s}
  .unique-scene{position:fixed;inset:0;z-index:7;display:grid;place-items:center;align-content:center;gap:1.4vh;pointer-events:none;transition:opacity .5s,scale .5s}
  .unique-scene.part{opacity:0;scale:.3}
  .rayons-arc{position:absolute;left:50%;top:50%;width:260vmax;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,#ff4f8b 0 6deg,transparent 6deg 15deg,#ffb347 15deg 21deg,transparent 21deg 30deg,#6dffb0 30deg 36deg,transparent 36deg 45deg,#3fc1ff 45deg 51deg,transparent 51deg 60deg,#b64dff 60deg 66deg,transparent 66deg 75deg);
    -webkit-mask:radial-gradient(circle,transparent 6%,#000 16%,transparent 60%);mask:radial-gradient(circle,transparent 6%,#000 16%,transparent 60%);opacity:.5;animation:tourne-r 7s linear infinite}
  .onde{position:absolute;left:50%;top:50%;width:20vmin;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:6px solid #fff;animation:onde 1.6s ease-out infinite}
  .onde.o2{animation-delay:.5s;border-color:#ff4f8b} .onde.o3{animation-delay:1s;border-color:#3fc1ff}
  @keyframes onde{from{scale:.2;opacity:1}to{scale:9;opacity:0}}
  .u-carte{position:relative;width:min(58vw,44vh,360px);animation:u-carte 1.1s cubic-bezier(.2,1.4,.3,1) both,u-flotte 3s 1.1s ease-in-out infinite}
  @keyframes u-carte{0%{scale:0;rotate:-900deg;filter:brightness(8)}60%{scale:1.25;rotate:8deg;filter:brightness(2)}100%{scale:1;rotate:0deg;filter:none}}
  @keyframes u-flotte{50%{translate:0 -10px;rotate:1.5deg}}
  .u-mot{position:relative;font-family:var(--display);font-size:clamp(60px,15vw,190px);line-height:.9;letter-spacing:.06em;color:#fff;animation:u-mot .5s cubic-bezier(.2,1.6,.3,1) both,u-arc 1.2s linear infinite;
    text-shadow:0 0 20px #ff4f8b,0 0 60px #b64dff,4px 4px 0 #ff4f8b,-4px -4px 0 #3fc1ff}
  @keyframes u-mot{from{scale:6;opacity:0}}
  .unique-scene.or .rayons-arc{background:repeating-conic-gradient(from 0deg,#ffd447 0 6deg,transparent 6deg 15deg,#fff6c9 15deg 21deg,transparent 21deg 30deg);opacity:.5}
  .unique-scene.or .u-mot{animation:u-mot .5s cubic-bezier(.2,1.6,.3,1) both;line-height:1.15;padding-top:.12em;font-size:clamp(46px,11vw,150px);background:linear-gradient(180deg,#fffbe6,#ffd447 50%,#b07800);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 24px #ffb000) drop-shadow(0 4px 0 #6b4300)}
  .unique-scene.or .u-nom{background:linear-gradient(180deg,#fffbe6,#ffd447);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 12px #ffb000)}
  @keyframes u-arc{to{filter:hue-rotate(360deg)}}
  .u-nom{position:relative;font-family:var(--display);font-size:clamp(28px,5vw,56px);line-height:1;background:linear-gradient(90deg,#ffb347,#ff7ab5,#c995ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff4f8b);animation:apparait .6s .5s both}
  .u-sous{position:relative;font-weight:800;color:#fff;text-shadow:0 2px 6px #000;animation:apparait .6s .9s both;text-align:center;padding:0 16px}
  .salon.chaos>h2{visibility:hidden}
  @media (prefers-reduced-motion:reduce){ .salon.secousse{animation:none} .voile-fx.gresille{animation:none} }

  /* ---------- chauvedex ---------- */
  .dexhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .anneau{position:relative;width:86px;height:86px}
  .anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
  .anneau b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:17px}
  .fiche{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:26px;align-items:start}
  .fiche .grand{width:100%}
  .faits{display:grid;gap:8px;margin:14px 0}
  .fait{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--trait);font-size:15px}
  .fait span{color:var(--mut)}
  .exemplaires{display:grid;gap:8px}
  .ex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--pan2);border:1px solid var(--trait)}
  .ex .mono{font-size:14px}
  .ex .row{margin-left:auto}

  /* ---------- collections ---------- */
  .fini{box-shadow:0 0 0 1px var(--ok),0 0 20px rgba(79,227,154,.18)}

  /* ---------- marché ---------- */
  .lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
  .lot{position:relative;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;padding:10px;border-radius:16px;background:var(--pan);border:1px solid var(--trait);transition:transform .15s,box-shadow .2s}
  .lot:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--trait2)}
  .lot.moi{box-shadow:0 0 0 1px var(--orange)}
  .lot.tete{box-shadow:0 0 0 2px var(--ok),0 0 18px rgba(79,227,154,.25)}
  .lot .corps{display:grid;gap:3px;padding:0 4px 4px;min-width:0}
  .lot .corps .chrono{font-size:15px}
  .lot .offre-a{font-size:20px}
  .chrono{font:600 13px var(--mono);color:var(--orange-c);font-variant-numeric:tabular-nums}
  .chrono.urgent{color:var(--ko);text-shadow:0 0 8px rgba(255,90,110,.7);animation:pouls .8s infinite}
  .etat{font-size:13px;font-weight:700;min-height:1em}
  .etat.ok{color:var(--ok)} .etat.ko{color:var(--ko)}
  /* fenêtre d'une enchère */
  .modal-in.large-ench{max-width:900px}
  .enchere{--rc:var(--r-commun);display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:26px;align-items:start;border-radius:16px}
  .enchere.bump .ench-chiffres{animation:bump .7s}
  .ench-chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 8px;padding:14px;border-radius:14px;background:var(--pan2);border:1px solid var(--trait)}
  .ench-chiffres>div{display:grid;gap:2px;min-width:0}
  .ench-chiffres .gros{font:600 26px var(--mono);font-variant-numeric:tabular-nums}
  .ench-chiffres .gros.chrono{color:var(--orange-c)}
  .ench-chiffres .gros.chrono.urgent{color:var(--ko)}
  .miser{display:grid;gap:10px;margin-top:10px}
  .btn.big{font-size:18px;padding:13px 20px}
  .miser .perso{display:flex;gap:8px}
  .miser input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;background:var(--nuit);border:1px solid var(--trait2);font-family:var(--mono)}
  .regle{font-size:13px;margin:12px 0 0}
  .histo{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:260px;overflow:auto}
  .histo li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--pan2);font-size:14px}
  .histo li.meneur{box-shadow:inset 3px 0 0 var(--orange);background:rgba(255,123,28,.1)}
  .histo li.moi .qui{color:var(--orange-c)}
  .histo li .t{font:400 12px var(--mono);color:var(--mut2)}
  .histo li.vide-h{display:block;color:var(--mut)}
  .ench-info,.miser,.miser>*{min-width:0}
  @media (max-width:700px){ .enchere{grid-template-columns:minmax(0,1fr);gap:14px} .ench-art{max-width:150px;margin:0 auto} .ench-chiffres .gros{font-size:22px} .miser .perso .btn{padding:9px 12px;font-size:14px} .lots{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }

  /* ---------- succès ---------- */
  /* succès : un en-tête de progression, puis une grille de tuiles par famille */
  .su-tete{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:18px;
    background:radial-gradient(60% 140% at 0% 50%,rgba(255,123,28,.14),transparent 60%),var(--pan)}
  .su-anneau{--p:0%;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(closest-side,var(--pan) 78%,transparent 80%),conic-gradient(#ff7b1c,#ff4f8b,#b64dff var(--p),var(--trait) 0)}
  .su-anneau b{font-family:var(--display);font-size:30px;font-weight:400}
  .su-anneau div{white-space:nowrap;line-height:1}
  .su-anneau span{color:var(--mut);font-size:14px;margin-left:1px}
  .su-gain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:22px;font-weight:800;margin:4px 0 2px}
  .su-gain .mut{font-size:14px;font-weight:600}
  .su-sauts{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 18px;padding:8px 0;background:linear-gradient(var(--nuit) 70%,transparent)}
  .su-sauts a{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--trait2);background:var(--pan);color:var(--txt);text-decoration:none;font-weight:700;font-size:13.5px}
  .su-sauts a small{color:var(--mut);font-size:11.5px}
  .su-sauts .pastille-n{position:static;margin-left:2px}
  .suf{margin-bottom:26px;scroll-margin-top:64px}
  .suf h2{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 12px}
  .suf h2 small{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
  .sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .sut{--p:0%;position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--pan);border:1px solid var(--trait);transition:transform .15s,border-color .15s}
  .sut:hover{transform:translateY(-2px);border-color:var(--trait2)}
  .sut-h{display:flex;justify-content:space-between;align-items:flex-start}
  .sut .emo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:30px;line-height:1;background:var(--pan2);border:1px solid var(--trait2);filter:grayscale(.7);opacity:.75}
  .sut h3{margin:6px 0 0;font-size:16px;line-height:1.2}
  .sut p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.35;flex:1}
  .sut-b{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px}
  .sut-b .jauge{flex:1;margin:0}
  .sut-b .jauge>i{width:var(--p)}
  .sut-b .mono{color:var(--mut);white-space:nowrap}
  .sut-b .gain{margin-left:auto;white-space:nowrap;font-weight:700}
  .sut .btn{margin-top:8px;width:100%;justify-content:center}
  .sut.pret{border-color:transparent;background:linear-gradient(var(--pan),var(--pan)) padding-box,var(--neon) border-box;border:1px solid transparent;box-shadow:0 0 22px rgba(255,79,139,.25)}
  .sut.pret .emo{filter:none;opacity:1;background:radial-gradient(circle,rgba(255,123,28,.35),transparent 70%),var(--pan2);border-color:var(--orange);animation:sutPulse 1.6s ease-in-out infinite}
  @keyframes sutPulse{50%{transform:scale(1.08) rotate(-4deg)}}
  .sut.fait{border-color:color-mix(in srgb,var(--ok) 35%,var(--trait))}
  .sut.fait .emo{filter:none;opacity:1}
  .sut.fait .ok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#06140c}
  .sut.fait .ok svg{width:16px;height:16px}
  .sut.fait p,.sut.fait h3{opacity:.8}
  .onglet:disabled{opacity:.4;cursor:default}
  @media (max-width:700px){
    .su-tete{grid-template-columns:auto minmax(0,1fr);gap:14px}.su-tete .btn{grid-column:1/-1;justify-content:center}
    .su-anneau{width:68px;height:68px}.su-anneau b{font-size:24px}
    .onglets{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.onglet{flex:none}
    .su-sauts{margin-inline:-16px;padding-inline:16px}
    .sug{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .sut{padding:11px}.sut .emo{width:42px;height:42px;font-size:24px;border-radius:12px}.sut h3{font-size:14.5px}.sut p{font-size:12.5px}
    .sut-b{flex-wrap:wrap;gap:4px 8px}.sut-b .jauge{flex-basis:100%}
  }

  /* ---------- classement ---------- */
  .grades{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .gr{display:grid;justify-items:center;gap:4px;width:118px;padding:12px 8px;border-radius:14px;background:var(--pan);border:1px solid var(--trait);text-align:center;font-size:13px;font-weight:700}
  .gr svg{width:54px;height:54px}
  .gr small{font:400 11px var(--mono);color:var(--mut2)}
  .gr.moi{box-shadow:0 0 0 1px var(--orange),0 0 16px rgba(255,123,28,.3)}
  .table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .table th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:0 12px 10px}
  .table td{padding:10px 12px;border-top:1px solid var(--trait)}
  .table tr.moi td{background:rgba(255,123,28,.08)}
  .table .rang{font:600 15px var(--mono);width:48px}
  .table .pod{color:var(--orange-c);text-shadow:0 0 8px var(--orange)}
  .table .j{display:flex;align-items:center;gap:10px;font-weight:700}
  .table .j svg{width:30px;height:30px;flex:none}
  .scroll-x{overflow-x:auto}

  /* ---------- atelier ---------- */
  .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .form .plein{grid-column:1/-1}
  .depot{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
  .depot .apercu{width:120px;aspect-ratio:600/1066;border-radius:12px;border:1px dashed var(--trait2);display:grid;place-items:center;overflow:hidden;color:var(--mut2);font-size:12px;text-align:center}
  .depot .apercu img{width:100%;height:100%;object-fit:cover}
  .catalogue{display:grid;gap:8px}
  .cat{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--pan2)}
  .cat img{width:40px;aspect-ratio:600/1066;object-fit:cover;border-radius:6px}
  #modalIn input[type=checkbox]{width:auto;flex:none;margin:0}
  .coches label,.edition .row label{white-space:nowrap;font-weight:500}
  .filtres{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;}
  .filtres input,.filtres select{flex:0 1 200px;padding:9px 12px;border-radius:10px;background:var(--nuit);border:1px solid var(--trait2);color:inherit;font:inherit}
  .filtres input{flex:1 1 220px}
  .carte-atelier{display:grid;gap:6px}
  .carte-atelier .legende{font-size:12px;font-weight:700;color:var(--mut);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat.sansimg{grid-template-columns:minmax(0,1fr) auto}
  .edition{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
  .edition .apercu-carte{position:sticky;top:0}
  .coches{border:1px solid var(--trait2);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 18px}
  .coches label{display:flex;gap:8px;align-items:center}
  input[type=color]{width:52px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--trait2);background:none;cursor:pointer}
  .avert{margin:0;padding:10px 12px;border-radius:10px;border:1px solid #ff4d5e;color:#ffb3ba;font-size:14px}
  /* ----- ChauveDex ----- */
  .dex-titre{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .dex-titre h1{margin:0}
  .segment.grand button{padding:10px 22px;font-size:15px}
  .segment.grand button[aria-pressed="true"]{color:#1a0b12;background:linear-gradient(90deg,#ff7a18,#ff4f8b,#b64dff)}
  .rars{display:flex;flex-wrap:wrap;gap:8px}
  .rar-f{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--trait2);font-weight:700;font-size:13px;color:var(--mut)}
  .rar-f i,.pastille{width:9px;height:9px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc);display:inline-block}
  .rar-f.on{color:var(--txt);border-color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
  .segment{display:inline-flex;border:1px solid var(--trait2);border-radius:10px;overflow:hidden}
  .segment button{padding:9px 14px;font-weight:700;color:var(--mut)}
  .segment button[aria-pressed="true"]{background:var(--pan2);color:var(--txt)}
  .dx-groupe{margin-bottom:34px}
  .dx-groupe h2{display:flex;align-items:center;gap:10px;font-size:22px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--trait)}
  .dx-groupe h2 .mono{font-size:14px;margin-left:auto}
  .dx{display:grid;gap:7px}
  .dx-l{display:flex;gap:8px;align-items:baseline;font-size:13px;min-width:0}
  .dx-l .mono{color:var(--mut2);font-size:12px}
  .dx-l b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dx.manque .dx-l b{color:var(--mut2)}
  .nb{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
  /* ----- Classeur ----- */
  .classeur{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;margin-top:8px;perspective:2000px}
  .tourne{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--txt);border:1px solid var(--trait2);background:var(--pan);margin:0 14px;transition:transform .15s,opacity .15s,border-color .15s}
  .tourne svg{width:22px;height:22px}
  .tourne:not(:disabled):hover{transform:scale(1.08);border-color:#ff7a18}
  .tourne:disabled{opacity:.2;cursor:default}
  /* la couverture : cuir sombre, surpiqûre néon */
  .couverture{position:relative;padding:16px;border-radius:26px;background:radial-gradient(140% 90% at 50% 0,#2a1838,#170e20 60%,#0f0916);box-shadow:0 30px 60px -25px #000,inset 0 0 0 1px rgba(255,255,255,.05),inset 0 2px 0 rgba(255,255,255,.06)}
  .couverture::before{content:"";position:absolute;inset:7px;border-radius:20px;border:1.5px dashed rgba(255,122,24,.28);pointer-events:none}
  .classeur.complete .couverture::before{border-color:rgba(79,227,154,.5)}
  .feuilles{position:relative;display:grid;grid-template-columns:minmax(270px,.9fr) 40px minmax(0,1.6fr);border-radius:14px;overflow:hidden;background:#120c19;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .feuille{padding:30px 28px;min-height:480px;background:linear-gradient(180deg,#1b1424,#150f1d)}
  .feuille.gauche{display:flex;flex-direction:column;gap:14px;box-shadow:inset -22px 0 26px -22px #000}
  .feuille.droite{box-shadow:inset 22px 0 26px -22px #000;display:flex;align-items:center;justify-content:center}
  .titre-c{font-size:34px;margin:0;line-height:1.05}
  .desc-c{margin:0;color:var(--mut);font-style:italic}
  .medaille{position:relative;width:132px;aspect-ratio:1;margin:6px 0}
  .medaille svg{width:100%;height:100%;transform:rotate(-90deg)}
  .medaille>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .medaille b{font-family:var(--display);font-weight:400;font-size:36px;line-height:1;color:#fff}
  .medaille small{font-size:18px;color:var(--mut2)}
  .medaille span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
  .classeur.complete .medaille span{color:var(--ok)}
  .detail-r{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  .detail-r li{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--mut)}
  .detail-r b{margin-left:auto;color:var(--txt);font-size:13px}
  .sceau{margin-top:auto;display:grid;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--trait2)}
  .sceau.pret{border-color:#ff7a18;box-shadow:0 0 22px -6px rgba(255,122,24,.6)}
  .sceau.pris{opacity:.75}
  .sceau .puce svg{width:13px;height:13px}
  .prime-m{font-size:20px;margin-top:2px}
  /* la reliure au milieu */
  .anneaux{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;background:linear-gradient(90deg,#0b0710,#1d1427 50%,#0b0710)}
  .anneaux i{width:58px;height:14px;border-radius:99px;background:linear-gradient(180deg,#f3eefa,#9a90a8 50%,#4a4256);box-shadow:0 3px 4px rgba(0,0,0,.7)}
  /* les pochettes : 3 par rangée comme un vrai classeur */
  .poches{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px;align-items:start}
  /* une pochette en plastique : toujours au format exact d'une carte, que la case soit pleine ou vide */
  .poche{position:relative;align-self:start;padding:7% 6% 6%;border-radius:10px;
    background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 38%,rgba(255,255,255,.06) 70%,rgba(255,255,255,.1));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 3px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.4)}
  /* le rabat du haut, avec l'encoche en demi-lune pour attraper la carte */
  .poche::before{content:"";position:absolute;left:0;right:0;top:0;height:9%;z-index:2;pointer-events:none;border-radius:10px 10px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border-bottom:1px solid rgba(255,255,255,.22);
    -webkit-mask:radial-gradient(17% 85% at 50% 0,transparent 96%,#000 100%);mask:radial-gradient(17% 85% at 50% 0,transparent 96%,#000 100%)}
  /* le reflet du plastique passe par-dessus la carte et glisse au survol */
  .poche::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;
    background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.13) 36%,rgba(255,255,255,.03) 44%,transparent 50%,transparent 70%,rgba(255,255,255,.06) 76%,transparent 82%);
    background-size:240% 100%;background-position:100% 0;transition:background-position .9s cubic-bezier(.2,.7,.2,1)}
  .poche:hover::after{background-position:0 0}
  .poche>.carte{display:block;width:100%}
  /* sous coque : la coque PCA (étiquette + carte) tient dans la même hauteur qu'une carte, la grille reste alignée */
  .poche.sous-coque>.carte{aspect-ratio:63/88;display:grid;place-items:center}
  .poche.sous-coque .slab{width:93%}
  .poche>.carte .tc{filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  /* case vide : la pochette garde sa place, avec un creux au format d'une carte */
  .creux{display:grid;place-items:center;align-content:center;gap:6px;width:100%;aspect-ratio:63/88;border-radius:8px;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 8px,transparent 8px 16px),rgba(0,0,0,.18);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 40%,transparent),inset 0 0 18px rgba(0,0,0,.5)}
  .creux span{font-family:var(--display);font-size:40px;line-height:1;color:color-mix(in srgb,var(--rc) 60%,#3a2f4a);text-shadow:0 0 14px color-mix(in srgb,var(--rc) 45%,transparent)}
